<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公告事件提取 · 三栏骨架（D1）</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header>
  <h1>公告事件提取与核验 · 展示骨架</h1>
  <span id="modeBadge" class="mode-badge">未加载</span>
  <span class="meta" id="runMeta">D1 骨架 · 独立本地原型</span>
  <button class="btn ghost" id="verifyBtn" style="margin-left:auto">核验清单 D9</button>
  <button class="btn ghost" id="pairsBtn">跨文档配对 D8</button>
  <button class="btn ghost" id="integrationBtn">多公告集成 D10</button>
  <button class="btn ghost" id="metricsBtn">结果图表 D11</button>
</header>
<div id="simBanner" class="sim-banner">⚠ 模拟数据 —— 当前展示内容全部为模拟接口返回，不得计入真实成绩</div>

<main>
  <!-- 栏一：上传 -->
  <section class="col">
    <h2>① 上传</h2>
    <div class="body">
      <div class="drop" id="drop">
        <div>点击或拖入事件信封（可多选 / 整批拖入）</div>
        <div class="hint">支持 .json 信封批量上传 · 坏文件进失败列表 · <a href="/api/upload/log" download="upload_log.jsonl">下载上传日志</a></div>
      </div>
      <input type="file" id="fileInput" accept=".json" multiple hidden>
      <div id="fileList"></div>
      <div class="dataset-row">
        <select id="datasetSel" class="sel"></select>
        <button class="btn" id="loadBtn">加载</button>
      </div>
      <div class="dataset-row">
        <button class="btn ghost" id="exportCsvBtn">导出 CSV</button>
        <button class="btn ghost" id="exportJsonBtn">导出 JSON</button>
        <button class="btn ghost" id="resetBtn">清空</button>
      </div>
    </div>
  </section>

  <!-- 栏二：结果 -->
  <section class="col">
    <h2>② 抽取结果 <span id="evCount" class="meta"></span></h2>
    <div class="body" id="results">
      <div class="empty">尚未加载数据——先上传文件或选择数据集加载</div>
    </div>
  </section>

  <!-- 栏三：证据 -->
  <section class="col">
    <h2>③ 证据 <span id="srcCount" class="meta"></span></h2>
    <div class="body" id="evidences">
      <div class="empty">加载结果后此处显示证据列表</div>
    </div>
  </section>
</main>

<!-- D8：跨文档配对视图（双栏成员对比 + 三态判定；与三栏单文档视图互斥切换） -->
<section id="pairsView" class="pairs-view" hidden>
  <div class="pairs-wrap" id="pairsList">
    <div class="empty">配对视图未加载</div>
  </div>
</section>

<!-- D9：核验清单视图（先归因再判矛盾 + 双侧证据视图；四视图互斥） -->
<section id="verifyView" class="pairs-view" hidden>
  <div class="pairs-wrap" id="verifyList">
    <div class="empty">核验视图未加载</div>
  </div>
</section>

<!-- D10：多公告集成视图（10 组案例 + 缓存三态 + 出处链；四视图互斥） -->
<section id="integrationView" class="pairs-view" hidden>
  <div class="pairs-wrap" id="integrationList">
    <div class="empty">集成视图未加载</div>
  </div>
</section>

<!-- D11：真实结果图表视图（实算指标 vs 目标 + 解析器版本对比 + 覆盖范围声明；五视图互斥） -->
<section id="metricsView" class="pairs-view" hidden>
  <div class="pairs-wrap" id="metricsList">
    <div class="empty">结果图表未加载</div>
  </div>
</section>

<footer>
  状态约定：成功 / 失败 / 无法读取 / 待复核 / 模拟 ｜ 字段值均挂 evidence_id 出处锚点 ｜ 数据契约见 docs/API.md
</footer>

<script type="module" src="./js/app.js"></script>
</body>
</html>
